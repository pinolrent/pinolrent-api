# Air configuration for the dev hot-reload flow (`make watch`).
# Docs: https://github.com/air-verse/air
root = "."
tmp_dir = "tmp/air"

[build]
  cmd = "go build -o tmp/air/api ./cmd/api"
  bin = "tmp/air/api"
  include_ext = ["go", "env", "toml"]
  exclude_regex = ["_test\\.go$", "\\.codegraph"]
  exclude_dir = ["bin", "bruno", "scripts", ".git"]
  delay = 1000
  stop_on_error = true
  log = "air.log"

[log]
  time = false

[color]
  app = ""
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true