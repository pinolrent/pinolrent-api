name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (ubuntu, go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check go mod tidy
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: make vet

      - name: go test (no race)
        run: make test

      - name: go test -race
        run: make test-race

      - name: Coverage
        run: make cover

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: .
          go-version-input: "1.26"

  build-demo:
    name: build and e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, lint, vuln]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: End-to-end smoke
        run: make demo

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, lint, vuln]
    steps:
      - uses: actions/checkout@v4

      # Docker Hub rate-limits anonymous pulls from shared runner IPs: the
      # last two main builds died on a 429 for alpine:3.22 and on an auth
      # timeout pulling the buildkit image for setup-buildx. Route the
      # daemon through Google's pull-through mirror so base-image pulls
      # never hit registry-1.docker.io directly.
      - name: Use pull-through mirror for Docker Hub
        run: |
          printf '{\n  "registry-mirrors": ["https://mirror.gcr.io"]\n}\n' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker

      # Build only: the deployed image is built from the repo at deploy time.
      # This exists so a broken Dockerfile shows up in the PR. The default
      # docker driver (no buildx setup): its pulls go through the daemon,
      # and with them the mirror above. Retry kept for mirror blips.
      - name: Build image
        run: |
          for attempt in 1 2 3; do
            if docker build --build-arg VERSION=ci-${{ github.sha }} .; then
              exit 0
            fi
            echo "build attempt $attempt failed, retrying in 30s"
            sleep 30
          done
          exit 1

  bruno:
    name: bruno collection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, lint, vuln]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start ephemeral server
        run: |
          go build -o /tmp/pinolrent-api ./cmd/api
          DATABASE_URL=/tmp/bruno.db JWT_SECRET=bruno-ci-secret-min-32B-ok-0123456789 PORT=8132 ADMIN_EMAILS=admin@example.com /tmp/pinolrent-api &
          echo $! > /tmp/pinolrent.pid
          health_ok=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8132/health; then health_ok=1; break; fi
            sleep 1
          done
          [ "$health_ok" = "1" ] || { echo 'server did not become healthy'; exit 1; }

      # Retry: a fresh npx resolves @usebruno/cli's @aws-sdk deps to the
      # latest published version, and runs landing inside an AWS SDK publish
      # window hit npm metadata/tarball propagation lag (404 on
      # @aws-sdk/credential-provider-http).
      - name: Run Bruno collection
        working-directory: bruno/pinolrent-api
        run: |
          for attempt in 1 2 3; do
            if npx --yes @usebruno/cli@4.1.0 run -r --env-var baseUrl=http://localhost:8132; then
              exit 0
            fi
            echo "bruno attempt $attempt failed, retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Stop server
        if: always()
        run: kill $(cat /tmp/pinolrent.pid) || true
