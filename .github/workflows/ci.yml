name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (ubuntu, go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check go mod tidy
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: make vet

      - name: go test (no race)
        run: make test

      - name: go test -race
        run: make test-race

      - name: Coverage
        run: make cover

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: .
          go-version-input: "1.26"

  build-demo:
    name: build and e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: End-to-end smoke
        run: make demo

  bruno:
    name: bruno collection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start ephemeral server
        run: |
          go build -o /tmp/pinolrent-api ./cmd/api
          DATABASE_URL=/tmp/bruno.db JWT_SECRET=bruno-ci-secret-min-32B-ok-0123456789 PORT=8132 /tmp/pinolrent-api &
          echo $! > /tmp/pinolrent.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8132/health && break
            sleep 1
          done

      - name: Run Bruno collection
        run: npx --yes @usebruno/cli run bruno/pinolrent-api -r --env-var baseUrl=http://localhost:8132

      - name: Stop server
        if: always()
        run: kill $(cat /tmp/pinolrent.pid) || true
